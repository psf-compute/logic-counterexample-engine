[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logic-counterexample-engine"
version = "0.1.0"
description = "A Python propositional-logic engine that checks argument validity and finds counterexamples."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "psf-compute" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
